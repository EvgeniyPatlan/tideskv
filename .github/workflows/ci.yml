name: ci
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18 libclang-rt-18-dev liblz4-dev libzstd-dev
      - name: Allow TSan memory mappings (Ubuntu 24.04 kernels)
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset ${{ matrix.preset }} -DTIDESKV_WERROR=ON
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: ctest --preset ${{ matrix.preset }} -j 4

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18 libclang-rt-18-dev liblz4-dev libzstd-dev
      - run: scripts/coverage.sh
        env:
          TIDESKV_CMAKE_ARGS: -DTIDESKV_WERROR=ON

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run --Werror $(git ls-files '*.h' '*.cc')

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18 libclang-rt-18-dev liblz4-dev libzstd-dev
      - run: cmake --preset fuzz -DTIDESKV_WERROR=ON && cmake --build --preset fuzz -j --target resp_parser_fuzz
      - run: mkdir -p corpus && build/fuzz/tests/resp_parser_fuzz corpus -max_total_time=1800 -max_len=65536

  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.2.5
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tests/compat/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18 liblz4-dev libzstd-dev
      - run: cmake --preset release -DTIDESKV_WERROR=ON && cmake --build --preset release -j --target tideskv-server
      - run: scripts/compat.sh build/release/src/tideskv-server --diff
        env:
          TIDESKV_REF_ADDR: 127.0.0.1:6379
          TIDESKV_DIFF_SEEDS: "1-20"

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy-18 liblz4-dev libzstd-dev
      - run: cmake --preset debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build --preset debug -j
      - run: run-clang-tidy-18 -p build/debug -quiet "^${GITHUB_WORKSPACE}/src/"
